pgcluster:
  image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:d7a81cb5da3182d95d0da5fabfb9e484e375db899dcd54b684105f1e8966e9ca
  databaseName: photoview
  generation: 1

  cluster:
    storage:
      size: 2Gi

app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  controllers:
    photoview:
      containers:
        photoview:
          image:
            repository: docker.io/photoview/photoview
            tag: 2.4.0@sha256:4fafa6cd680c7c01c79ab1a1d52e359655ea44808b3367683c741195a80ee1e4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            PHOTOVIEW_DATABASE_DRIVER: "postgres"
            PHOTOVIEW_LISTEN_IP: "0.0.0.0"
            PHOTOVIEW_MEDIA_CACHE: "/cache"
            PHOTOVIEW_POSTGRES_URL:
              valueFrom:
                secretKeyRef:
                  name: photoview-cluster-v1-app
                  key: uri
          probes:
            startup:
              enabled: true
            liveness:
              enabled: true
            readiness:
              enabled: true
  service:
    photoview:
      controller: photoview
      ports:
        http:
          port: 80
  ingress:
    photoview:
      className: internal
      hosts:
        - host: photoview.internal.neils.house
          paths:
            - path: /
              service:
                identifier: photoview
                port: http
  persistence:
    cache:
      storageClass: longhorn-ephemeral
      suffix: cache
      size: 8Gi
      accessMode: ReadWriteOnce
    photos:
      type: nfs
      server: nas.internal
      path: /mnt/data/photos
      globalMounts:
        - path: /mnt/data/photos
          readOnly: true
