pvc:
  pvcName: radicale-data
  storageRequest: 128Mi
  moverSecurityContext:
    runAsUser: 2999
    runAsGroup: 2999

global:
  createDefaultServiceAccount: false

app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 2999
      runAsGroup: 2999
  configMaps:
    radicale:
      data:
        config: |
          [server]
          hosts = 0.0.0.0:5232

          [auth]
          type = htpasswd
          htpasswd_filename = /config/users
          htpasswd_encryption = bcrypt

          [storage]
          filesystem_folder = /data/collections
  externalSecrets:
    radicale:
      secretStoreRef:
        name: bitwarden
        kind: ClusterSecretStore
      data:
        - secretKey: users
          remoteRef:
            key: RADICALE_AUTH_DB
  controllers:
    radicale:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        radicale:
          image:
            repository: tomsquest/docker-radicale
            tag: 3.9.2.0@sha256:cc586f75ec709d45d15dfbf20e53bab99e85ee5a4d7beafc7bbf852b2f07a2da
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            TAKE_FILE_OWNERSHIP: "false"
          probes:
            startup:
              enabled: true
            liveness:
              enabled: true
            readiness:
              enabled: true
  service:
    radicale:
      controller: radicale
      ports:
        http:
          port: 5232
  ingress:
    radicale:
      className: external
      hosts:
        - host: radicale.neils.house
          paths:
            - path: /
              service:
                identifier: radicale
                port: http
  persistence:
    config:
      type: configMap
      name: radicale
      globalMounts:
        - path: /config/config
          subPath: config
          readOnly: true
    data:
      existingClaim: radicale-data
    users:
      type: secret
      name: radicale
      globalMounts:
        - path: /config/users
          subPath: users
          readOnly: true
