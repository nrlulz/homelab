pvc:
  pvcName: paperless-data
  storageRequest: 4Gi

pgcluster:
  image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  databaseName: paperless
  generation: 1

  cluster:
    storage:
      size: 2Gi

global:
  createDefaultServiceAccount: false

base:
  defaultPodOptions: &defaultPodOptions
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

  containerSecurityContext: &containerSecurityContext
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  server: &serverBase
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: 3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
    securityContext: *containerSecurityContext
    envFrom:
      - configMapRef:
          name: paperless-ngx
      - secretRef:
          name: paperless-ngx
    env:
      PAPERLESS_DBHOST:
        valueFrom:
          secretKeyRef:
            name: paperless-cluster-v1-app
            key: host
      PAPERLESS_DBPASS:
        valueFrom:
          secretKeyRef:
            name: paperless-cluster-v1-app
            key: password

gotenberg:
  global:
    nameOverride: gotenberg
  defaultPodOptions: *defaultPodOptions
  controllers:
    gotenberg:
      strategy: RollingUpdate
      containers:
        gotenberg:
          image:
            repository: docker.io/gotenberg/gotenberg
            tag: 8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
          command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
          securityContext: *containerSecurityContext
          probes:
            startup:
              enabled: true
            liveness:
              enabled: true
            readiness:
              enabled: true
  service:
    gotenberg:
      controller: gotenberg
      ports:
        http:
          port: 3000

tika:
  global:
    nameOverride: tika
  defaultPodOptions: *defaultPodOptions
  controllers:
    tika:
      strategy: RollingUpdate
      containers:
        tika:
          image:
            repository: docker.io/apache/tika
            tag: 3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
          securityContext: *containerSecurityContext
          probes:
            startup:
              enabled: true
            liveness:
              enabled: true
            readiness:
              enabled: true
  service:
    tika:
      controller: tika
      ports:
        tika:
          port: 9998
  persistence:
    tmp:
      type: emptyDir

valkey:
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: 9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b

server:
  defaultPodOptions: *defaultPodOptions

  configMaps:
    config:
      data:
        PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
        PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
        PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
        PAPERLESS_CONSUMER_STABILITY_DELAY: "30"
        PAPERLESS_DATE_ORDER: "MDY"
        PAPERLESS_DBENGINE: "postgresql"
        PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
        PAPERLESS_LOGGING_DIR: "/logs"
        PAPERLESS_REDIS: "redis://paperless-ngx-valkey:6379"
        PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "false"
        PAPERLESS_TIKA_ENABLED: "1"
        PAPERLESS_TIKA_ENDPOINT: "http://paperless-ngx-tika:9998"
        PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://paperless-ngx-gotenberg:3000"
        PAPERLESS_TIME_ZONE: "America/Los_Angeles"
        PAPERLESS_TRUSTED_PROXIES: "10.244.0.0/16"
        PAPERLESS_URL: "https://docs.neils.house"
        S6_READ_ONLY_ROOT: "1"
        S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"

  externalSecrets:
    paperless-ngx:
      secretStoreRef:
        name: bitwarden
        kind: ClusterSecretStore
      target:
        template:
          data:
            PAPERLESS_SOCIALACCOUNT_PROVIDERS: >
              {
                "openid_connect": {
                  "APPS": [
                    {
                      "provider_id": "pocketid",
                      "name": "Pocket ID",
                      "client_id": "6643a76f-dae7-4cad-a7c0-625b324d0dac",
                      "secret": "{{ .PAPERLESS_OPENID_CLIENT_SECRET }}",
                      "settings": {
                        "server_url": "https://auth.neils.house/.well-known/openid-configuration"
                      }
                    }
                  ]
                }
              }
            PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
      data:
        - secretKey: PAPERLESS_OPENID_CLIENT_SECRET
          remoteRef:
            key: PAPERLESS_OPENID_CLIENT_SECRET
        - secretKey: PAPERLESS_SECRET_KEY
          remoteRef:
            key: PAPERLESS_SECRET_KEY

  controllers:
    server:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        server:
          <<: *serverBase
          probes:
            startup:
              enabled: true
              spec:
                failureThreshold: 10
                initialDelaySeconds: 30
            liveness:
              enabled: true
            readiness:
              enabled: true

    exporter:
      type: cronjob
      cronjob:
        schedule: "0 * * * *"
      containers:
        exporter:
          <<: *serverBase
          args:
            - document_exporter
            - /usr/src/paperless/export
            - --delete
      pod:
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/controller
                      operator: In
                      values:
                        - server
                topologyKey: kubernetes.io/hostname

  service:
    server:
      controller: server
      ports:
        http:
          port: 8000

  ingress:
    server:
      className: external
      hosts:
        - host: docs.neils.house
          paths:
            - path: /
              service:
                identifier: server
                port: http

  persistence:
    data:
      existingClaim: paperless-data
      globalMounts:
        - path: /usr/src/paperless/data
          subPath: data
        - path: /usr/src/paperless/media
          subPath: media
    export:
      type: nfs
      server: nas.internal
      path: /mnt/data/paperless_exports
      advancedMounts:
        exporter:
          exporter:
            - path: /usr/src/paperless/export
    inbox:
      type: nfs
      server: nas.internal
      path: /mnt/data/paperless_inbox
      advancedMounts:
        server:
          server:
            - path: /usr/src/paperless/consume
    logs:
      type: emptyDir
    run:
      type: emptyDir
    tmp:
      type: emptyDir
