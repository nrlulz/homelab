pvc:
  pvcName: paperless-data
  storageRequest: 4Gi

pgcluster:
  image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:6d207b34e2859e55ee7653d57321ef28c86d9c4b42e9e66609756565f0cc5542
  databaseName: paperless
  generation: 1

  cluster:
    storage:
      size: 2Gi

global:
  createDefaultServiceAccount: false

base:
  defaultPodOptions: &defaultPodOptions
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

  containerSecurityContext: &containerSecurityContext
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  server: &serverBase
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: 3.0.5@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b
    securityContext: *containerSecurityContext
    envFrom:
      - configMapRef:
          name: paperless-ngx
      - secretRef:
          name: paperless-ngx
    env:
      PAPERLESS_DBHOST:
        valueFrom:
          secretKeyRef:
            name: paperless-cluster-v1-app
            key: host
      PAPERLESS_DBPASS:
        valueFrom:
          secretKeyRef:
            name: paperless-cluster-v1-app
            key: password

gotenberg:
  global:
    nameOverride: gotenberg
  defaultPodOptions: *defaultPodOptions
  controllers:
    gotenberg:
      strategy: RollingUpdate
      containers:
        gotenberg:
          image:
            repository: docker.io/gotenberg/gotenberg
            tag: 8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
          command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
          securityContext: *containerSecurityContext
          probes:
            startup:
              enabled: true
            liveness:
              enabled: true
            readiness:
              enabled: true
  service:
    gotenberg:
      controller: gotenberg
      ports:
        http:
          port: 3000

tika:
  global:
    nameOverride: tika
  defaultPodOptions: *defaultPodOptions
  controllers:
    tika:
      strategy: RollingUpdate
      containers:
        tika:
          image:
            repository: docker.io/apache/tika
            tag: 3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
          securityContext: *containerSecurityContext
          probes:
            startup:
              enabled: true
            liveness:
              enabled: true
            readiness:
              enabled: true
  service:
    tika:
      controller: tika
      ports:
        tika:
          port: 9998
  persistence:
    tmp:
      type: emptyDir

valkey:
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: 9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328

server:
  defaultPodOptions: *defaultPodOptions

  configMaps:
    config:
      data:
        PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
        PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
        PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
        PAPERLESS_CONSUMER_STABILITY_DELAY: "30"
        PAPERLESS_DATE_ORDER: "MDY"
        PAPERLESS_DBENGINE: "postgresql"
        PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
        PAPERLESS_LOGGING_DIR: "/logs"
        PAPERLESS_REDIS: "redis://paperless-ngx-valkey:6379"
        PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "false"
        PAPERLESS_TIKA_ENABLED: "1"
        PAPERLESS_TIKA_ENDPOINT: "http://paperless-ngx-tika:9998"
        PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://paperless-ngx-gotenberg:3000"
        PAPERLESS_TIME_ZONE: "America/Los_Angeles"
        PAPERLESS_TRUSTED_PROXIES: "10.244.0.0/16"
        PAPERLESS_URL: "https://docs.neils.house"
        S6_READ_ONLY_ROOT: "1"
        S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"

  controllers:
    server:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        server:
          <<: *serverBase
          probes:
            startup:
              enabled: true
            liveness:
              enabled: true
            readiness:
              enabled: true

    exporter:
      type: cronjob
      cronjob:
        schedule: "0 * * * *"
      containers:
        exporter:
          <<: *serverBase
          args:
            - document_exporter
            - /usr/src/paperless/export
            - --delete
      pod:
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/controller
                      operator: In
                      values:
                        - server
                topologyKey: kubernetes.io/hostname

  service:
    server:
      controller: server
      ports:
        http:
          port: 8000

  ingress:
    server:
      className: external
      hosts:
        - host: docs.neils.house
          paths:
            - path: /
              service:
                identifier: server
                port: http

  persistence:
    data:
      existingClaim: paperless-data
      globalMounts:
        - path: /usr/src/paperless/data
          subPath: data
        - path: /usr/src/paperless/media
          subPath: media
    export:
      type: nfs
      server: nas.internal
      path: /mnt/data/paperless_exports
      advancedMounts:
        exporter:
          exporter:
            - path: /usr/src/paperless/export
    inbox:
      type: nfs
      server: nas.internal
      path: /mnt/data/paperless_inbox
      advancedMounts:
        server:
          server:
            - path: /usr/src/paperless/consume
    logs:
      type: emptyDir
    run:
      type: emptyDir
    tmp:
      type: emptyDir

  rawResources:
    secret:
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        spec:
          secretStoreRef:
            name: bitwarden
            kind: ClusterSecretStore
          target:
            template:
              data:
                PAPERLESS_SOCIALACCOUNT_PROVIDERS: >
                  {
                    "openid_connect": {
                      "APPS": [
                        {
                          "provider_id": "pocketid",
                          "name": "Pocket ID",
                          "client_id": "6643a76f-dae7-4cad-a7c0-625b324d0dac",
                          "secret": "{{ `{{ .PAPERLESS_OPENID_CLIENT_SECRET }}` }}",
                          "settings": {
                            "server_url": "https://auth.neils.house/.well-known/openid-configuration"
                          }
                        }
                      ]
                    }
                  }
                PAPERLESS_SECRET_KEY: "{{ `{{ .PAPERLESS_SECRET_KEY }}` }}"
          data:
            - secretKey: PAPERLESS_OPENID_CLIENT_SECRET
              remoteRef:
                key: PAPERLESS_OPENID_CLIENT_SECRET
            - secretKey: PAPERLESS_SECRET_KEY
              remoteRef:
                key: PAPERLESS_SECRET_KEY

