global:
  createDefaultServiceAccount: false

app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
  externalSecrets:
    unpackerr:
      secretStoreRef:
        name: bitwarden
        kind: ClusterSecretStore
      data:
        - secretKey: UN_RADARR_0_API_KEY
          remoteRef:
            key: RADARR_API_KEY
        - secretKey: UN_SONARR_0_API_KEY
          remoteRef:
            key: SONARR_API_KEY
  controllers:
    unpackerr:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        unpackerr:
          image:
            repository: ghcr.io/unpackerr/unpackerr
            tag: v1.0.0@sha256:21c6bfa4f4c86ab2dd0232da0dfb3ed4c5d929e42e09894e7b4d2154d0c144f6
          env:
            TZ: "America/Los_Angeles"
            UN_RADARR_0_URL: http://radarr.radarr.svc.cluster.local:7878
            UN_SONARR_0_URL: http://sonarr.sonarr.svc.cluster.local:8989
            UN_WEBSERVER_LOG_FILE: /logs/unpackerr.log
          envFrom:
            - secretRef:
                name: unpackerr
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
  persistence:
    downloads:
      type: nfs
      server: nas.internal
      path: /mnt/media/downloads
      globalMounts:
        - path: /mnt/media/downloads
    logs:
      type: emptyDir
