global:
  createDefaultServiceAccount: false

app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
  externalSecrets:
    unpackerr:
      secretStoreRef:
        name: bitwarden
        kind: ClusterSecretStore
      data:
        - secretKey: UN_RADARR_0_API_KEY
          remoteRef:
            key: RADARR_API_KEY
        - secretKey: UN_SONARR_0_API_KEY
          remoteRef:
            key: SONARR_API_KEY
  controllers:
    unpackerr:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        unpackerr:
          image:
            repository: ghcr.io/unpackerr/unpackerr
            tag: v1.0.1@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
          env:
            TZ: "America/Los_Angeles"
            UN_RADARR_0_URL: http://radarr.radarr.svc.cluster.local:7878
            UN_RADARR_0_PROTOCOLS: "torrent,usenet"
            UN_SONARR_0_URL: http://sonarr.sonarr.svc.cluster.local:8989
            UN_SONARR_0_PROTOCOLS: "torrent,usenet"
          envFrom:
            - secretRef:
                name: unpackerr
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
  persistence:
    downloads:
      type: nfs
      server: nas.internal
      path: /mnt/media/downloads
      globalMounts:
        - path: /mnt/media/downloads
