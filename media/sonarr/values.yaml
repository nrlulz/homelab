pvc:
  pvcName: sonarr-data
  storageRequest: 2Gi
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

global:
  createDefaultServiceAccount: false

app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  controllers:
    sonarr:
      containers:
        sonarr:
          image:
            repository: ghcr.io/home-operations/sonarr
            tag: 5.0.0.2800@sha256:89b57d1302099223e200c901d9127d085e43d6088f355b1b59869b9936cdaa10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            TZ: "America/Los_Angeles"
          probes:
            liveness: &probe
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
            readiness: *probe
  service:
    sonarr:
      controller: sonarr
      ports:
        http:
          port: 8989
  ingress:
    sonarr:
      className: internal
      hosts:
        - host: sonarr.internal.neils.house
          paths:
            - path: /
              service:
                identifier: sonarr
                port: http
  persistence:
    config:
      existingClaim: sonarr-data
    media:
      type: nfs
      server: nas.internal
      path: /mnt/media
      globalMounts:
        - path: /mnt/media
    tmp:
      type: emptyDir
