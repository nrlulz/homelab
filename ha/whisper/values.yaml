global:
  createDefaultServiceAccount: false

app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
  controllers:
    whisper:
      containers:
        whisper:
          image:
            repository: docker.io/rhasspy/wyoming-whisper
            tag: 3.6.0@sha256:b7da5869ac9caba5f8db1c0dec373fb46a58d31f4aee1855faa7b49b7c0d4b49
          args:
            - --language
            - en
            - --model
            - base-int8
            - --data-dir
            - /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          probes:
            startup:
              enabled: true
            liveness:
              enabled: true
            readiness:
              enabled: true
  service:
    whisper:
      controller: whisper
      ports:
        http:
          port: 10300
  persistence:
    data:
      type: emptyDir
    dotcache:
      type: emptyDir
      globalMounts:
        - path: /.cache
    tmp:
      type: emptyDir
